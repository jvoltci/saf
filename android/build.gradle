group 'com.jvoltci.saf'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ ships built-in Kotlin; applying KGP on top of it conflicts. But AGP 9
// projects can opt out via `android.builtInKotlin=false`, and then nothing
// provides Kotlin unless we apply KGP ourselves. So mirror the exact rule
// Flutter uses in FlutterPluginUtils.isBuiltInKotlinEnabled: built-in Kotlin is
// on when AGP major >= 9 and the property is absent or true.
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinProp = providers.gradleProperty('android.builtInKotlin').getOrNull()
// Deliberately not an elvis chain: Groovy treats a parsed `false` as falsy, so
// `prop?.toBoolean() ?: true` would wrongly read builtInKotlin=false as true.
def builtInKotlin = agpMajor >= 9 && (builtInKotlinProp == null || builtInKotlinProp.toBoolean())
if (!builtInKotlin) {
    // pluginManager.apply(), not `apply plugin:`, on purpose. Flutter's
    // built-in-Kotlin check regex-scans this file's text and cannot see the
    // guard above, so a literal `apply plugin: 'kotlin-android'` string
    // triggers a false "plugin applies KGP" warning on AGP 9. This is the
    // same call Flutter's own FlutterPluginUtils.kt uses.
    pluginManager.apply("kotlin-android")
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

android {
    namespace 'com.jvoltci.saf'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    /// Allow usage of `CoroutineScope` to run heavy
    // computation and queries outside the Main (UI) Thread
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
