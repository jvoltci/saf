site_name: saf
site_description: One class for the Android Storage Access Framework — pickers, permissions, file management, streaming read/write, recursive walk, and progress.
site_url: https://jvoltci.github.io/saf/
repo_url: https://github.com/jvoltci/saf
repo_name: jvoltci/saf
edit_uri: edit/master/docs/
copyright: Built &amp; maintained by jvoltci · MIT License

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Get started:
      - Install & first run: getting-started.md
      - Recipes: guide.md
  - Migrate: migration.md
  - Reference:
      - Architecture: architecture.md
      - API reference (dartdoc): https://jvoltci.github.io/saf/api/
  - FAQ: faq.md

# Internal planning/QA docs live under docs/ but are not part of the site.
exclude_docs: |
  superpowers/
  testing/

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jvoltci/saf
    - icon: simple/dart
      link: https://pub.dev/packages/saf
