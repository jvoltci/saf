<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="saf — one class for the Android Storage Access Framework">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B0764"/>
      <stop offset="0.5" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E1035" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>

  <!-- decorative orbs -->
  <g opacity="0.14" fill="#FFFFFF">
    <circle cx="1120" cy="60" r="120"/>
    <circle cx="60" cy="360" r="90"/>
  </g>

  <!-- folder + document glyph -->
  <g transform="translate(892,104)" filter="url(#soft)">
    <path d="M18 26 h74 l22 26 h96 a18 18 0 0 1 18 18 v104 a18 18 0 0 1 -18 18 H18 a18 18 0 0 1 -18 -18 V44 a18 18 0 0 1 18 -18 z" fill="#A78BFA"/>
    <rect x="52" y="8" width="150" height="150" rx="14" fill="url(#doc)"/>
    <rect x="74" y="42" width="106" height="12" rx="6" fill="#7C3AED" opacity="0.55"/>
    <rect x="74" y="70" width="106" height="12" rx="6" fill="#7C3AED" opacity="0.40"/>
    <rect x="74" y="98" width="70"  height="12" rx="6" fill="#7C3AED" opacity="0.30"/>
  </g>

  <!-- wordmark -->
  <text x="76" y="176" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="150" font-weight="800" fill="#FFFFFF" letter-spacing="-4">saf</text>

  <!-- version pill -->
  <g transform="translate(360,92)">
    <rect width="176" height="58" rx="29" fill="#FFFFFF" opacity="0.16"/>
    <text x="88" y="39" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">v2.0.0</text>
  </g>

  <!-- tagline -->
  <text x="80" y="248" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="600" fill="#F5F3FF">One class for the Android Storage Access Framework</text>
  <text x="80" y="292" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#D6BCFA">pick · list · walk · read · write · stream · copy — typed errors &amp; progress</text>

  <!-- tech badges -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#3B0764">
    <g transform="translate(80,332)"><rect width="168" height="42" rx="21" fill="#EDE9FE"/><text x="84" y="28" text-anchor="middle">Flutter ≥ 3.10</text></g>
    <g transform="translate(262,332)"><rect width="150" height="42" rx="21" fill="#EDE9FE"/><text x="75" y="28" text-anchor="middle">Dart ≥ 3.0</text></g>
    <g transform="translate(426,332)"><rect width="150" height="42" rx="21" fill="#EDE9FE"/><text x="75" y="28" text-anchor="middle">minSdk 21</text></g>
    <g transform="translate(590,332)"><rect width="168" height="42" rx="21" fill="#DCFCE7"/><text x="84" y="28" text-anchor="middle" fill="#14532D">pana 150/150</text></g>
  </g>
</svg>
